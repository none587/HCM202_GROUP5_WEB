<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="petalPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd7e6"/>
      <stop offset="45%" stop-color="#f8a9c7"/>
      <stop offset="100%" stop-color="#ef86b0"/>
    </linearGradient>
    <linearGradient id="petalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3b1cb"/>
      <stop offset="100%" stop-color="#dd6f99"/>
    </linearGradient>
  </defs>
  <g filter="url(#blur)" opacity="0.7">
    <ellipse cx="165" cy="560" rx="90" ry="180" fill="url(#petalPink)" transform="rotate(-18 165 560)"/>
    <ellipse cx="285" cy="515" rx="78" ry="162" fill="url(#petalDark)" transform="rotate(16 285 515)"/>
    <ellipse cx="390" cy="575" rx="68" ry="145" fill="url(#petalPink)" transform="rotate(-10 390 575)"/>
    <ellipse cx="635" cy="210" rx="78" ry="160" fill="url(#petalPink)" transform="rotate(34 635 210)"/>
    <ellipse cx="760" cy="155" rx="62" ry="140" fill="url(#petalDark)" transform="rotate(-22 760 155)"/>
    <ellipse cx="835" cy="260" rx="55" ry="118" fill="url(#petalPink)" transform="rotate(12 835 260)"/>
  </g>
</svg>